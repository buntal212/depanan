name: Deploy Admin Jangur

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # Bersihkan hasil build lama.
      # File konfigurasi aaPanel/Nginx tetap dipertahankan.
      - name: Bersihkan build lama
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            WEBROOT="/www/wwwroot/admin.jangur-keramik.my.id"

            echo "Membersihkan build lama..."

            find "$WEBROOT" \
              -mindepth 1 \
              -maxdepth 1 \
              ! -name ".user.ini" \
              ! -name ".htaccess" \
              ! -name ".well-known" \
              -exec rm -rf {} +

            echo "Build lama berhasil dibersihkan."

      - name: Upload build baru
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "dist/spa/*"
          target: "/www/wwwroot/admin.jangur-keramik.my.id/"
          strip_components: 2

      - name: Verifikasi deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            WEBROOT="/www/wwwroot/admin.jangur-keramik.my.id"

            test -f "$WEBROOT/index.html"

            echo "================================="
            echo "DEPLOY BERHASIL"
            echo "================================="
            ls -lah "$WEBROOT"